name: Update dependent Repositories
on:
  push:
    branches:
      - main

jobs:
  create_pr:
    name: PR for ${{ matrix.repo }}
    strategy:
      matrix:
        repo: [ "alphagov/licensing-frontend",
                "alphagov/licensing-admin",
                "alphagov/licensing-scheduled-jobs"
        ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 #v7.0
        with:
          repository: ${{ matrix.repo }}
          token: ${{ secrets.bot_token }} # this needs to be a PAT token... store in secrets name is an example
          path: ${{ matrix.repo }}

      - name: Update Submodule and Open PR
        env:
          GH_TOKEN: ${{ secrets.bot_token }} # rename where applicable.
        run: |
          cd ${{ matrix.repo }}
          
          git config --global user.name "the bot account name or github-actions[bot]"
          git config --global user.email "the bot account email or 41898282+github-actions[bot]@users.noreply.github.com"
          
          BRANCH_NAME="automated-submodule-~update-${GITHUB_SHA::7}"
          git checkout -b $BRANCH_NAME
          
          git submodule update --remote
          
          git add .
          git commit -m "Automated update from source repo"
          git push origin $BRANCH_NAME
          
          gh pr create \
            --title "Automated PR: Updating common submodule" \
            --body "This PR was automatically generated by a GitHub Action triggered by commit $GITHUB_SHA in the source repository." \
            --base main \
            --head $BRANCH_NAME
          
